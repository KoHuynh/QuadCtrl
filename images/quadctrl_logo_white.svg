  <!-- badge -->
  <rect x="90" y="95" width="860" height="240" rx="58" fill="url(#pill)" stroke="#1a1a1a" stroke-width="3"/>
  <rect opacity="0" x="96" y="100" width="848" height="108" rx="52" fill="url(#gloss)"/>

  <!-- emblem -->
  <g stroke="url(#ink)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="216" cy="215" r="88" fill="none"/>
    <line x1="225.2" y1="224.2" x2="240.7" y2="239.7"/>
    <circle cx="253.5" cy="252.5" r="18" fill="none" stroke-width="7"/>
