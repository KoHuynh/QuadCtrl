  <circle cx="589.3" cy="43.3" r="3.6" fill="#8a8a8a" opacity="0.30"/>
  <circle cx="623.5" cy="42.2" r="3.6" fill="#8a8a8a" opacity="0.45"/>
  <circle cx="657.2" cy="41.8" r="3.6" fill="#8a8a8a" opacity="0.60"/>
  <circle cx="690.2" cy="42.4" r="3.6" fill="#8a8a8a" opacity="0.75"/>
  <g transform="translate(783.7 48.9) rotate(6.6)">
