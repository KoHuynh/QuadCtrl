<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" width="1040" height="430" role="img" aria-label="QuadCtrl">
  <title>QuadCtrl</title>
  <defs>
    <linearGradient id="pill" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e6e6e6"/>
      <stop offset="0.45" stop-color="#f7f7f7"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="120" y1="125" x2="920" y2="305">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.55" stop-color="#000000"/>
      <stop offset="0.7" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
  </defs>

  <!-- orbit, far side (behind the badge) -->
