  <!-- wordmark -->
  <g stroke="url(#ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M370,155 H386 A26,26 0 0 1 412,181 V249 A26,26 0 0 1 386,275 H370 A26,26 0 0 1 344,249 V181 A26,26 0 0 1 370,155 Z"/>
    <path d="M386,249 L420,285"/>
    <path d="M432,191 V255 A20,20 0 0 0 452,275 H486"/>
    <path d="M486,191 V275"/>
    <path d="M560,211 A20,20 0 0 0 540,191 H526 A20,20 0 0 0 506,211 V255 A20,20 0 0 0 526,275 H560"/>
    <path d="M560,211 V275"/>
    <path d="M634,191 H600 A20,20 0 0 0 580,211 V255 A20,20 0 0 0 600,275 H634"/>
    <path d="M634,155 V275"/>
    <path d="M714,155 H680 A26,26 0 0 0 654,181 V249 A26,26 0 0 0 680,275 H714"/>
    <path d="M749,163 V257 A18,18 0 0 0 767,275 H777"/>
    <path d="M737,191 H775"/>
    <path d="M797,275 V211 A20,20 0 0 1 817,191 H835"/>
    <path d="M855,155 V257 A18,18 0 0 0 873,275 H877"/>
