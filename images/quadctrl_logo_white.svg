    <line x1="206.8" y1="224.2" x2="191.3" y2="239.7"/>
    <circle cx="178.5" cy="252.5" r="18" fill="none" stroke-width="7"/>
    <line x1="174.4" y1="241.2" x2="182.6" y2="263.8" stroke-width="5"/>
    <line x1="206.8" y1="205.8" x2="191.3" y2="190.3"/>
    <circle cx="178.5" cy="177.5" r="18" fill="none" stroke-width="7"/>
    <line x1="184.5" y1="167.1" x2="172.5" y2="187.9" stroke-width="5"/>
    <line x1="225.2" y1="205.8" x2="240.7" y2="190.3"/>
