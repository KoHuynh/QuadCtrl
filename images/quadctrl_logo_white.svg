      <line x1="-30" y1="12" x2="-30" y2="7" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="-30" cy="7" rx="19" ry="5.5" fill="#000000" fill-opacity="0.55" stroke="#8a8a8a" stroke-width="2.4"/>
      <line x1="30" y1="12" x2="30" y2="7" stroke="#8a8a8a" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="30" cy="7" rx="19" ry="5.5" fill="#000000" fill-opacity="0.55" stroke="#8a8a8a" stroke-width="2.4"/>
