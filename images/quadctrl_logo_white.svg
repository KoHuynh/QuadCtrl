      <line x1="0" y1="0" x2="30" y2="-12" stroke="#8a8a8a" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-30" y2="12" stroke="#8a8a8a" stroke-width="5" stroke-linecap="round"/>
